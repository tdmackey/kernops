# Daily: find lines whose base is behind upstream, move each line's patch
# series to the new base, and open a pull request with the result.
#
# `kpm updates` finds them: a newer linux-7.3.y tag for a stable line, a newer
# archive publication for an Ubuntu line. A conflict opens an issue instead of
# a pull request. A human reviews and merges.
#
# Needs: a self-hosted runner with the kernel mirrors under /srv/mirrors, and a
# token that can write contents, pull requests and issues. A pull request made
# with the default GITHUB_TOKEN does not start kernel-ci.yml; use an app or
# personal token (secret TREADMILL_TOKEN) if kernel-ci must run on it.

name: update-and-rebase
on:
  schedule:
    - cron: '17 6 * * *'    # daily, away from the top of the hour
  workflow_dispatch:
    inputs:
      base:
        description: 'one line (empty = every line that is behind)'
        required: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.base || 'all' }}
  cancel-in-progress: false

env:
  KPM_MIRRORS: /srv/mirrors

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: d
        env:
          WANT: ${{ inputs.base }}
        run: |
          # Exit 10 = something moved. Exit 2 = a remote could not be checked;
          # that only matters here if it was a base.
          rc=0; ./scripts/kpm --json updates > /tmp/det.json || rc=$?
          case $rc in 0|2|10) ;; *) cat /tmp/det.json; exit "$rc" ;; esac
          if jq -e --arg want "$WANT" '
               any(.[]; .what == "base" and ($want == "" or .line == $want)
                        and (.status | startswith("error")))' /tmp/det.json >/dev/null; then
            jq '.[] | select(.what == "base")' /tmp/det.json
            echo "::error::a base could not be checked"
            exit 2
          fi
          jq -c --arg want "$WANT" '
            [ .[]
              | select(.what == "base")
              | select(.status == "STALE" or .status == "AHEAD-OF-ARCHIVE")
              | select($want == "" or .line == $want)
              | {base: .line, target: .expected_tag, version: .version} ]
          ' /tmp/det.json | tee /tmp/m.json
          echo "matrix=$(cat /tmp/m.json)" >> "$GITHUB_OUTPUT"

  rebase:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: [self-hosted, kernel-builder, arm64]
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    env:
      LINE: ${{ matrix.base }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ matrix.version }}
      GH_TOKEN: ${{ secrets.TREADMILL_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Skip if this update already has a branch
        id: idem
        run: |
          ref="treadmill/$LINE/$TARGET"
          if gh api "repos/$GITHUB_REPOSITORY/branches/$(jq -rn --arg r "$ref" '$r|@uri')" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ref already exists"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the line to the new base
        if: steps.idem.outputs.skip != 'true'
        id: rb
        run: |
          kpm() { ./scripts/kpm --line "$LINE" "$@"; }
          echo "old=$(./scripts/kpm lines | awk -F'\t' -v b="$LINE" '$1==b{print $2}')" >> "$GITHUB_OUTPUT"
          kpm fetch
          # The current patch series, so the rebase can write a range-diff.
          kpm import
          rc=0; kpm rebase "$TARGET" > "$RUNNER_TEMP/rebase.txt" || rc=$?
          cat "$RUNNER_TEMP/rebase.txt"
          case $rc in
            0) echo "conflict=false" >> "$GITHUB_OUTPUT"
               cp "$HOME/.cache/kpm/range-diff-$LINE.txt" "$RUNNER_TEMP/range-diff.txt" || : > "$RUNNER_TEMP/range-diff.txt" ;;
            3) echo "conflict=true" >> "$GITHUB_OUTPUT"
               git checkout -- kernel/ ;;
            *) exit "$rc" ;;
          esac

      - name: Open an issue for a conflict
        if: steps.idem.outputs.skip != 'true' && steps.rb.outputs.conflict == 'true'
        run: |
          title="treadmill: $LINE -> $TARGET needs a human"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            echo "::notice::an issue is already open for this conflict"
            exit 0
          fi
          cat > "$RUNNER_TEMP/issue.md" <<EOF
          The automatic move of \`$LINE\` to \`$TARGET\` ($VERSION) stopped on a conflict.

          To continue by hand:
          \`\`\`
          ./scripts/kpm --line $LINE fetch
          ./scripts/kpm --line $LINE rebase $TARGET
          # resolve in the worktree it names (docs/backporting.md), git add, then:
          ./scripts/kpm --line $LINE import --continue
          ./scripts/kpm --line $LINE export
          \`\`\`
          EOF
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"

      - name: Open the pull request
        if: steps.idem.outputs.skip != 'true' && steps.rb.outputs.conflict == 'false'
        env:
          OLD: ${{ steps.rb.outputs.old }}
        run: |
          # kpm rebase moved the base, dropped what landed upstream and wrote the patch series.
          ./scripts/kpm --line "$LINE" verify --strict

          ref="treadmill/$LINE/$TARGET"
          git config user.name 'treadmill[bot]'
          git config user.email 'treadmill@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "$ref"
          git add kernel/
          git commit -m "treadmill: $LINE -> $TARGET ($VERSION)"
          git push origin "$ref"
          python3 scripts/write-treadmill-report.py \
            --repo-root "$GITHUB_WORKSPACE" --base "$LINE" --old "$OLD" \
            --target "$TARGET" --version "$VERSION" \
            --range-diff "$RUNNER_TEMP/range-diff.txt" \
            --output "$RUNNER_TEMP/treadmill-report.md"
          gh pr create --head "$ref" --title "treadmill: $LINE -> $VERSION" \
            --body-file "$RUNNER_TEMP/treadmill-report.md"
          cat "$RUNNER_TEMP/treadmill-report.md" >> "$GITHUB_STEP_SUMMARY"
