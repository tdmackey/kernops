# The SRU treadmill — daily: detect new archive publications, move each
# stale base's patch stack to the published tag, open a PR with the result.
# kernel-ci.yml (paths: kernel/**) is the gate on that PR; a human merges.
#
# Modeled on NV-Kernels update-and-rebase.yml (idempotency marker, rebase
# --onto, chain into build) with our differences: trigger is the Launchpad
# publishing API (tools/treadmill/detect.py), conflicts open an issue with
# the failing state described, and the PR carries the range-diff.
#
# Needs: self-hosted runner with the kernel mirror (see kernel-ci.yml),
# GH_TOKEN with contents+PR+issues write.

name: update-and-rebase
on:
  schedule:
    - cron: '17 6 * * *'    # daily, offset to dodge top-of-hour load
  workflow_dispatch:
    inputs:
      base:
        description: 'single base (empty = all stale)'
        required: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.base || 'all' }}
  cancel-in-progress: false

env:
  KERNEL_MIRROR: /srv/mirrors/noble.git

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: d
        run: |
          set +e
          python3 tools/treadmill/detect.py --json > /tmp/det.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 10 ]; then
            cat /tmp/det.json
            exit "$rc"
          fi
          jq -c --arg want "${{ inputs.base }}" '
            [ .[]
              | select(.status == "STALE" or .status == "AHEAD-OF-ARCHIVE")
              | select($want == "" or .base == $want)
              | {base: .base, target: .expected_tag, version: .version} ]
          ' /tmp/det.json | tee /tmp/m.json
          echo "matrix=$(cat /tmp/m.json)" >> "$GITHUB_OUTPUT"

  rebase:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: [self-hosted, kernel-builder, arm64]
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Idempotency check
        id: idem
        run: |
          ref="treadmill/${{ matrix.base }}/${{ matrix.target }}"
          if git ls-remote --heads origin "$ref" | grep -q . ; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ref already exists — treadmill already ran for this publication"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase stack onto published tag
        if: steps.idem.outputs.skip != 'true'
        id: rb
        run: |
          set -x
          git -C "$KERNEL_MIRROR" fetch --no-tags origin \
            "refs/tags/${{ matrix.target }}:refs/tags/${{ matrix.target }}" || true
          kpm() { ./scripts/kpm --line "${{ matrix.base }}" "$@"; }
          echo "old=$(./scripts/kpm lines | awk -F'\t' -v b="${{ matrix.base }}" '$1==b{print $2}')" >> "$GITHUB_OUTPUT"
          kpm fetch
          kpm import                      # the current stack, so the rebase can write a range-diff
          rc=0; kpm rebase "${{ matrix.target }}" > "$RUNNER_TEMP/rebase.txt" || rc=$?
          cat "$RUNNER_TEMP/rebase.txt"
          case $rc in
            0) echo "conflict=false" >> "$GITHUB_OUTPUT"
               cp "$HOME/.cache/kpm/range-diff-${{ matrix.base }}.txt" "$RUNNER_TEMP/range-diff.txt" || : > "$RUNNER_TEMP/range-diff.txt" ;;
            3) echo "conflict=true" >> "$GITHUB_OUTPUT"
               git checkout -- kernel/ ;;
            *) exit "$rc" ;;
          esac

      - name: Open conflict issue
        if: steps.idem.outputs.skip != 'true' && steps.rb.outputs.conflict == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh issue create \
            --title "treadmill: ${{ matrix.base }} -> ${{ matrix.target }} needs a human" \
            --label treadmill-conflict \
            --body "$(cat <<EOF
          Automatic rebase of \`${{ matrix.base }}\` onto \`${{ matrix.target }}\`
          (published: ${{ matrix.version }}) hit conflicts.

          Reproduce locally:
          \`\`\`
          ./scripts/kpm --line ${{ matrix.base }} fetch
          ./scripts/kpm --line ${{ matrix.base }} rebase ${{ matrix.target }}
          # resolve in the worktree it names (docs/backporting.md), git add, then:
          ./scripts/kpm --line ${{ matrix.base }} import --continue
          ./scripts/kpm --line ${{ matrix.base }} export
          \`\`\`
          EOF
          )"

      - name: Export + open PR
        if: steps.idem.outputs.skip != 'true' && steps.rb.outputs.conflict == 'false'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          base="${{ matrix.base }}" target="${{ matrix.target }}"
          old="${{ steps.rb.outputs.old }}"
          # kpm rebase already moved the base, dropped what landed and re-exported the series.
          ./scripts/kpm --line "$base" verify --strict

          ref="treadmill/$base/${{ matrix.target }}"
          git config user.name 'treadmill[bot]'
          git config user.email 'treadmill@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "$ref"
          git add kernel/
          git commit -m "treadmill: $base -> $target (${{ matrix.version }})"
          git push origin "$ref"
          python3 scripts/write-treadmill-report.py \
            --repo-root "$GITHUB_WORKSPACE" --base "$base" --old "$old" \
            --target "$target" --version "${{ matrix.version }}" \
            --range-diff "$RUNNER_TEMP/range-diff.txt" \
            --output "$RUNNER_TEMP/treadmill-report.md"
          pr_url=$(gh pr create --head "$ref" \
            --title "treadmill: $base -> ${{ matrix.version }}" \
            --body-file "$RUNNER_TEMP/treadmill-report.md")
          gh pr comment "$pr_url" --body-file "$RUNNER_TEMP/treadmill-report.md"
          cat "$RUNNER_TEMP/treadmill-report.md" >> "$GITHUB_STEP_SUMMARY"
