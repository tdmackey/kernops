# Source registry: the only place a tree is described. See docs/design-7.3-lts.md §5.
#
#   url         canonical remote
#   mirror      directory under $KPM_MIRRORS holding a local clone (used if present)
#   tags        tag glob to track; fetched as refs/tags/<source>/<tag>
#   branch      or a branch to track (force-updated upstreams: the ledger pins SHAs)
#   delta_base  where this source's own commits start:
#                 ref:<name>     a ref in the unified repo
#                 grep:<regex>   newest ancestor whose subject matches
#   parent      source this one is layered on; its content is not counted twice
#   noise       subject regexes for release bookkeeping
#   packaging_dir  the source's debian.<name> directory (holds its config annotations)
#   upstream    mainline release the tree is built on when that is not the line's
#               own (a forward-port source); used to fetch it efficiently
#   role        "base": lines build on its tags; "reference": lookups only
#   kind        "vendor" (default): its delta is harvested
#               "local": commits we chose ourselves with `kpm add`
#
# Which sources a line uses is set in kernel/lines/<line>/line.toml.

[stable]
role   = "base"
url    = "https://kernel.googlesource.com/pub/scm/linux/kernel/git/stable/linux.git"
mirror = "linux-stable"
tags   = "v7.3*"

[ubuntu-noble]                     # base of hwe-6.17
role   = "base"
url    = "https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/noble"
mirror = "noble"
tags   = "Ubuntu-hwe-*"

[ubuntu-resolute]                  # Ubuntu 26.04's own 7.0 kernel: the base of the 7.0 line.
role     = "base"                  # Canonical's vendor 7.0 kernels are built on these tags.
url      = "https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/resolute"
tags     = "Ubuntu-7.0.0-*"

[mainline]                         # where our own backports and Fixes: follow-ups come from
role   = "reference"
url    = "https://kernel.googlesource.com/pub/scm/linux/kernel/git/torvalds/linux.git"
mirror = "linux-stable"            # the stable repo's master branch is mainline
branch = "master"

[local]                            # our own patches: `kpm add <sha>`
kind = "local"
band = 6000

[ubuntu]
band       = 0
url        = "https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/stonking"
mirror     = "linux-ubuntu"
tags       = "Ubuntu-7.3.0-*"
packaging_dir = "debian.master"
delta_base = "ref:stable/v7.3"
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker']

[nvidia]
band       = 2000
parent     = "ubuntu"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-nvidia/+git/stonking"
mirror     = "linux-nvidia-stonking.git"
tags       = "Ubuntu-nvidia-7.3.0-*"
packaging_dir = "debian.nvidia"
delta_base = 'grep:^UBUNTU: Ubuntu-7\.3\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

[nvidia-bos]                       # built on 7.0: a forward-port source for 7.3-lts
band       = 2500
parent     = "nvidia"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-nvidia/+git/resolute"
mirror     = "linux-nvidia-resolute.git"
upstream   = "v7.0"
tags       = "Ubuntu-nvidia-bos-7.0.0-*"
delta_base = 'grep:^UBUNTU: Ubuntu-7\.0\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']
packaging_dir = "debian.nvidia-bos"
# Its config is relative to Ubuntu 7.0 (upstream = "v7.0"): the 7.0 line merges
# it, the 7.3 line does not.

[gcp]
band       = 3000
parent     = "ubuntu"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-gcp/+git/stonking"
mirror     = "linux-gcp"
tags       = "Ubuntu-gcp-7.3.0-*"
packaging_dir = "debian.gcp"
delta_base = 'grep:^UBUNTU: Ubuntu-7\.3\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

["gcp-7.0"]                          # Canonical's 26.04 GCP kernel: what GCP runs today
band       = 3500
parent     = "gcp"
upstream   = "v7.0"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-gcp/+git/resolute"
tags       = "Ubuntu-gcp-7.0.0-*"
delta_base = 'grep:^UBUNTU: Ubuntu-7\.0\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']
packaging_dir = "debian.gcp"         # relative to Ubuntu 7.0: merged by the 7.0 line only

[aws]
band       = 4000
parent     = "ubuntu"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-aws/+git/stonking"
mirror     = "linux-aws"
tags       = "Ubuntu-aws-7.3.0-*"
packaging_dir = "debian.aws"
delta_base = 'grep:^UBUNTU: Ubuntu-7\.3\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

[azure]
band       = 5000
parent     = "ubuntu"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-azure/+git/stonking"
mirror     = "linux-azure-stonking.git"
tags       = "Ubuntu-azure-7.3.0-*"
packaging_dir = "debian.azure"
delta_base = 'grep:^UBUNTU: Ubuntu-7\.3\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

# ── The vendors' 7.0 kernels (Ubuntu 26.04). The 7.0 line takes its vendor
# patches from these: they have the same base as that line. `upstream` makes the
# fetch offer only v7.0 as common history, and puts their config and modprobe
# rules (packaging_dir) in the 7.0 line only.

["nvidia-7.0"]                     # all but one of its patches are in nvidia-bos too; where the
band       = 2700                  # two differ, nvidia-bos has the version we take. So it is
parent     = "nvidia-bos"          # layered on nvidia-bos, and applied after it.
upstream   = "v7.0"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-nvidia/+git/resolute"
mirror     = "linux-nvidia-resolute.git"
tags       = "Ubuntu-nvidia-7.0.0-*"
packaging_dir = "debian.nvidia"
delta_base = 'grep:^UBUNTU: Ubuntu-7\.0\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

["aws-7.0"]
band       = 4500
upstream   = "v7.0"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-aws/+git/resolute"
tags       = "Ubuntu-aws-7.0.0-*"
packaging_dir = "debian.aws"
delta_base = 'grep:^UBUNTU: Ubuntu-7\.0\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

["azure-7.0"]
band       = 5500
upstream   = "v7.0"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-azure/+git/resolute"
tags       = "Ubuntu-azure-7.0.0-*"
packaging_dir = "debian.azure"
delta_base = 'grep:^UBUNTU: Ubuntu-7\.0\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

# ── The vendors' 6.17 kernels for noble. The hwe-6.17 line takes its vendor
# patches from these. Ubuntu 25.10 (questing) had 6.17 first and has stopped;
# the noble backports are the trees that still get releases. There is no
# NVIDIA BOS kernel on 6.17: linux-nvidia-6.17 is NVIDIA's only 6.17 tree.
# (NVIDIA's github branch 24.04_linux-nvidia-6.17-next is the same commit as the
# newest Ubuntu-nvidia-6.17 tag.) A tree is built on Ubuntu's own 6.17 release or
# on the noble hwe-6.17 release after it; delta_base accepts both.

["nvidia-6.17"]
band       = 2000
upstream   = "v6.17"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-nvidia/+git/noble"
tags       = "Ubuntu-nvidia-6.17-6.17.0-*"
packaging_dir = "debian.nvidia-6.17"
delta_base = 'grep:^UBUNTU: Ubuntu-(hwe-6\.17-)?6\.17\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

["gcp-6.17"]
band       = 3000
upstream   = "v6.17"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-gcp/+git/noble"
tags       = "Ubuntu-gcp-6.17-6.17.0-*"
packaging_dir = "debian.gcp-6.17"
delta_base = 'grep:^UBUNTU: Ubuntu-(hwe-6\.17-)?6\.17\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

["aws-6.17"]
band       = 4000
upstream   = "v6.17"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-aws/+git/noble"
tags       = "Ubuntu-aws-6.17-6.17.0-*"
packaging_dir = "debian.aws-6.17"
delta_base = 'grep:^UBUNTU: Ubuntu-(hwe-6\.17-)?6\.17\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

["azure-6.17"]
band       = 5000
upstream   = "v6.17"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-azure/+git/noble"
tags       = "Ubuntu-azure-6.17-6.17.0-*"
packaging_dir = "debian.azure-6.17"
delta_base = 'grep:^UBUNTU: Ubuntu-(hwe-6\.17-)?6\.17\.0-[0-9]+\.[0-9]+$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ']

# Azure's kernel with NVIDIA's patches, arm64 only: linux-azure-6.17 plus nearly
# all of linux-nvidia-6.17. Its own commits start at the Azure release it is
# built on; what it shares with nvidia-6.17 is counted there, not twice.
["azure-nvidia-6.17"]
band       = 5500
parent     = "nvidia-6.17"
upstream   = "v6.17"
url        = "https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-azure/+git/noble"
tags       = "Ubuntu-azure-nvidia-6.17-6.17.0-*"
packaging_dir = "debian.azure-nvidia-6.17"
delta_base = 'grep:^UBUNTU: Ubuntu-azure-6\.17-6\.17\.0-[0-9]+\.[0-9]+(~[0-9.]+)?$'
noise      = ['^UBUNTU: Ubuntu-', '^UBUNTU: Start new release', '^UBUNTU: link-to-tracker', '^UBUNTU: Move to ', '^Ubuntu: \[Packaging\]']
